apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-hubs-deploy
  labels:
    name: cc-hubs-deploy
    app: chitychat
spec:
  replicas: 1
  selector:
    matchLabels:
      name: cc-hubs-pod
      app: chitychat

  template:
    metadata:
      name: cc-hubs-pod
      labels:
        name: cc-hubs-pod
        app: chitychat
    spec:
      containers:
        - image: 192.168.69.1:5000/chitychat/cc_hubs:2.0-dev
          imagePullPolicy: Always
          name: cc-hubs
          command: 
            - cc_hubs
          envFrom:
            - secretRef:
                name: chitychat-secrets

